<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MozgaTrust — план для семьи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c241c;
      --muted: #4a5548;
      --line: rgba(28, 36, 28, 0.12);
      --bg0: #e7efe6;
      --bg1: #f3f6f1;
      --panel: rgba(255, 252, 247, 0.9);
      --green: #1f5c3a;
      --green-soft: #d7eadc;
      --amber: #8a5a12;
      --amber-soft: #f3e2c2;
      --shadow: 0 18px 50px rgba(28, 36, 28, 0.08);
      --radius: 28px;
    }
    * { box-sizing: border-box; }
    html { font-size: 20px; scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Manrope", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #cfe3d4 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #efe2c8 0%, transparent 45%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 45%, #eef2ea);
      min-height: 100vh;
    }
    .wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }
    .brand {
      font-family: "Literata", Georgia, serif;
      font-size: clamp(2.6rem, 7vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.02;
      margin: 0 0 12px;
      animation: rise .7s ease both;
    }
    .lead {
      font-size: 1.18rem;
      color: var(--muted);
      max-width: 28em;
      line-height: 1.45;
      margin: 0 0 28px;
      animation: rise .7s ease .08s both;
    }
    .chooser {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
      animation: rise .7s ease .14s both;
    }
    @media (max-width: 720px) {
      html { font-size: 18px; }
      .chooser { grid-template-columns: 1fr; }
      .hero-facts, .split { grid-template-columns: 1fr !important; }
    }
    .choice {
      border: 3px solid transparent;
      background: var(--panel);
      border-radius: var(--radius);
      padding: 24px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .2s ease, border-color .2s ease;
      font: inherit;
      color: inherit;
    }
    .choice:hover { transform: translateY(-2px); }
    .choice:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
    .choice.active { border-color: var(--green); background: #fffdf8; }
    .choice strong { display: block; font-size: 1.4rem; font-weight: 800; line-height: 1.2; }
    .choice small { display: block; color: var(--muted); font-size: .95rem; margin-top: 8px; line-height: 1.35; }
    .hero-facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 0 0 22px;
    }
    .fact {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
    .fact.accent { background: linear-gradient(160deg, #edf7ef, #fffaf1); }
    .fact .label { font-size: 1rem; color: var(--muted); margin-bottom: 10px; }
    .fact .value {
      font-family: "Literata", Georgia, serif;
      font-size: clamp(2rem, 4.5vw, 2.7rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -.02em;
    }
    .fact .hint { margin-top: 10px; color: var(--muted); font-size: .95rem; }
    .split {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 16px;
      margin-bottom: 22px;
    }
    .block {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
    .block h2 {
      font-family: "Literata", Georgia, serif;
      font-size: 1.6rem;
      margin: 0 0 16px;
    }
    .piles { display: grid; gap: 12px; }
    .pile {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 16px 18px;
      border-radius: 18px;
      background: var(--green-soft);
    }
    .pile.iis { background: var(--amber-soft); }
    .pile .name { font-weight: 800; font-size: 1.1rem; }
    .pile .sub { color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .pile .amt {
      font-family: "Literata", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .bar {
      height: 20px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      margin-top: 16px;
      background: #e5e8e2;
    }
    .bar .dep { background: var(--green); }
    .bar .iis { background: var(--amber); }
    .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    .steps li { display: grid; grid-template-columns: 58px 1fr; gap: 12px; }
    .steps .n {
      width: 58px; height: 58px; border-radius: 18px;
      display: grid; place-items: center;
      background: var(--green); color: #fff;
      font-weight: 800; font-size: 1.25rem;
    }
    .steps .t { font-weight: 800; font-size: 1.15rem; margin-bottom: 4px; }
    .steps .d { color: var(--muted); line-height: 1.4; }
    .section-title {
      font-family: "Literata", Georgia, serif;
      font-size: 1.8rem;
      margin: 30px 0 12px;
    }
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
    table { width: 100%; border-collapse: collapse; min-width: 740px; }
    th, td {
      padding: 16px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    th:first-child, td:first-child { text-align: left; }
    th {
      position: sticky; top: 0;
      background: #f7f3ea;
      font-size: .92rem;
      color: var(--muted);
      font-weight: 800;
    }
    td { font-size: 1.05rem; font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    tr.highlight td { background: #fff6df; }
    tr.good td { background: #eef8f0; }
    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.45;
      max-width: 42em;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .panel { animation: rise .45s ease both; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">MozgaTrust</h1>
    <p class="lead">План на 20 миллионов простыми словами: куда положить, сколько получать каждый месяц и что останется.</p>

    <div class="chooser" role="tablist" aria-label="Выбор варианта">
      <button class="choice active" id="btn-v1" type="button">
        <strong>Вариант 1 — пенсия сразу</strong>
        <small>100 тысяч ₽ каждый месяц с первого месяца</small>
      </button>
      <button class="choice" id="btn-v2" type="button">
        <strong>Вариант 2 — пенсия через 3 года</strong>
        <small>Сначала копим, потом 100 тысяч ₽ каждый месяц</small>
      </button>
    </div>

    <div id="app"></div>
    <p class="note">Это семейная модель «на пальцах», не банковская выписка. Цифры округлены. Перед решениями сверьте ставки в банке и у брокера.</p>
  </div>

  <script>
    const DATA = __DATA__;
    const fmt = (n) => new Intl.NumberFormat("ru-RU").format(Math.round(n));
    const mln = (n) => (n / 1_000_000).toFixed(1).replace(".", ",") + " млн ₽";

    function view(s) {
      const depPct = Math.round((s.dep0 / 20_000_000) * 100);
      const iisPct = 100 - depPct;
      const body = s.years.map((y) => {
        const cls = y.lump > 0 ? "highlight" : (y.year === 2031 ? "good" : "");
        return `<tr class="${cls}">
          <td>${y.year}</td>
          <td>${fmt(y.dep_end)}</td>
          <td>${fmt(y.iis_end)}</td>
          <td>${y.pension ? fmt(y.pension) : "—"}</td>
          <td>${y.lump ? fmt(y.lump) : "—"}</td>
          <td>${fmt(y.tax)}</td>
          <td><strong>${fmt(y.total)}</strong></td>
        </tr>`;
      }).join("");

      const when = s.pension_from_month === 1
        ? "С первого месяца"
        : "С 2029 года (после 3 лет)";
      const step2title = s.pension_from_month === 1 ? "Каждый месяц сразу" : "Первые 3 года";
      const step2text = s.pension_from_month === 1
        ? "Получаем 100 тысяч ₽ на жизнь с вклада."
        : "Пенсию не снимаем — проценты копятся на вкладе и в ИИС.";

      return `
        <div class="panel">
          <div class="hero-facts">
            <div class="fact accent">
              <div class="label">На жизнь каждый месяц</div>
              <div class="value">100 000 ₽</div>
              <div class="hint">${when}</div>
            </div>
            <div class="fact">
              <div class="label">Через 3 года заберём сразу</div>
              <div class="value">10 млн ₽</div>
              <div class="hint">С банковского вклада</div>
            </div>
            <div class="fact">
              <div class="label">К 2040 останется около</div>
              <div class="value">${mln(s.total_2040)}</div>
              <div class="hint">Если идти по плану</div>
            </div>
          </div>

          <div class="split">
            <div class="block">
              <h2>Куда кладём 20 млн</h2>
              <div class="piles">
                <div class="pile">
                  <div>
                    <div class="name">Банковский вклад</div>
                    <div class="sub">Отсюда пенсия и 10 млн</div>
                  </div>
                  <div class="amt">${mln(s.dep0)}</div>
                </div>
                <div class="pile iis">
                  <div>
                    <div class="name">ИИС — гособлигации</div>
                    <div class="sub">Растёт до 2031, потом можно забрать</div>
                  </div>
                  <div class="amt">${mln(s.iis0)}</div>
                </div>
              </div>
              <div class="bar" aria-hidden="true">
                <span class="dep" style="width:${depPct}%"></span>
                <span class="iis" style="width:${iisPct}%"></span>
              </div>
            </div>

            <div class="block">
              <h2>Четыре шага</h2>
              <ol class="steps">
                <li>
                  <div class="n">1</div>
                  <div>
                    <div class="t">Сейчас</div>
                    <div class="d">Делим деньги: часть во вклад, часть в ИИС.</div>
                  </div>
                </li>
                <li>
                  <div class="n">2</div>
                  <div>
                    <div class="t">${step2title}</div>
                    <div class="d">${step2text}</div>
                  </div>
                </li>
                <li>
                  <div class="n">3</div>
                  <div>
                    <div class="t">Через 3 года</div>
                    <div class="d">Забираем ещё 10 миллионов с вклада.</div>
                  </div>
                </li>
                <li>
                  <div class="n">4</div>
                  <div>
                    <div class="t">С 2031 года</div>
                    <div class="d">Закрываем ИИС. Всё вместе продолжает кормить пенсию.</div>
                  </div>
                </li>
              </ol>
            </div>
          </div>

          <h2 class="section-title">Таблица по годам</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Год</th>
                  <th>На вкладе</th>
                  <th>На ИИС</th>
                  <th>Пенсия за год</th>
                  <th>Ещё забрали</th>
                  <th>Налог</th>
                  <th>Всего осталось</th>
                </tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
          </div>
          <p class="note">
            Жёлтая строка — год, когда забираем 10 млн.
            Зелёная — год, когда деньги с ИИС переходят на вклад.
            Всего на пенсию за весь срок: <strong>${fmt(s.total_pension)} ₽</strong>.
            Налоги с процентов по вкладу: <strong>${fmt(s.total_tax)} ₽</strong>.
          </p>
        </div>`;
    }

    const app = document.getElementById("app");
    const btn1 = document.getElementById("btn-v1");
    const btn2 = document.getElementById("btn-v2");

    function show(key) {
      app.innerHTML = view(DATA[key]);
      btn1.classList.toggle("active", key === "v1");
      btn2.classList.toggle("active", key === "v2");
      history.replaceState(null, "", "#" + key);
    }

    btn1.addEventListener("click", () => show("v1"));
    btn2.addEventListener("click", () => show("v2"));
    show(location.hash === "#v2" ? "v2" : "v1");
  </script>
</body>
</html>
