<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MozgaTrust — план для семьи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #000000;
      --muted: #000000;
      --line: #000000;
      --bg0: #e8f3ec;
      --bg1: #ffffff;
      --panel: #ffffff;
      --green: #023018;
      --green-soft: #1f8f4e;
      --amber: #3d2000;
      --amber-soft: #ff9a1a;
      --shadow: 0 10px 0 rgba(0, 0, 0, 0.08);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html { font-size: 21px; scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Manrope", system-ui, sans-serif;
      background:
        linear-gradient(180deg, #b7dcc8 0%, #eef6f1 40%, #ffffff 100%);
      min-height: 100vh;
    }
    .wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }
    .brand {
      font-family: "Literata", Georgia, serif;
      font-size: clamp(2.6rem, 7vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.02;
      margin: 0 0 12px;
      animation: rise .7s ease both;
    }
    .lead {
      font-size: 1.18rem;
      color: var(--ink);
      max-width: 28em;
      line-height: 1.45;
      margin: 0 0 28px;
      animation: rise .7s ease .08s both;
      font-weight: 600;
    }
    .chooser {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
      animation: rise .7s ease .14s both;
    }
    @media (max-width: 720px) {
      html { font-size: 18px; }
      .chooser { grid-template-columns: 1fr; }
      .hero-facts, .split { grid-template-columns: 1fr !important; }
    }
    .choice {
      border: 4px solid #000;
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      text-align: left;
      cursor: pointer;
      box-shadow: 5px 5px 0 #000;
      transition: transform .15s ease, background .15s ease, color .15s ease;
      font: inherit;
      color: inherit;
    }
    .choice:hover { transform: translate(-1px, -1px); }
    .choice:focus-visible { outline: 4px solid #023018; outline-offset: 3px; }
    .choice.active {
      border-color: #000;
      background: #023018;
      color: #fff;
      box-shadow: 5px 5px 0 #000;
    }
    .choice.active small { color: #ffffff; }
    .choice strong { display: block; font-size: 1.4rem; font-weight: 800; line-height: 1.2; }
    .choice small { display: block; color: #000; font-size: .95rem; margin-top: 8px; line-height: 1.35; font-weight: 800; }
    .hero-facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 0 0 22px;
    }
    .fact {
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 5px 5px 0 #000;
      border: 4px solid #000;
    }
    .fact.accent {
      background: #023018;
      color: #fff;
      border-color: #000;
    }
    .fact.accent .label,
    .fact.accent .hint { color: #ffffff; }
    .fact.accent .value { color: #fff; }
    .fact .label { font-size: 1rem; color: #000; margin-bottom: 10px; font-weight: 800; }
    .fact .value {
      font-family: "Literata", Georgia, serif;
      font-size: clamp(2rem, 4.5vw, 2.7rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -.02em;
      color: #000;
    }
    .fact .hint { margin-top: 10px; color: #000; font-size: .95rem; font-weight: 800; }
    .split {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 16px;
      margin-bottom: 22px;
    }
    .block {
      background: #fff;
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: 5px 5px 0 #000;
      border: 4px solid #000;
    }
    .block h2 {
      font-family: "Literata", Georgia, serif;
      font-size: 1.6rem;
      margin: 0 0 16px;
      color: #000;
    }
    .piles { display: grid; gap: 12px; }
    .pile {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 16px 18px;
      border-radius: 16px;
      background: #1f8f4e;
      border: 4px solid #000;
      color: #fff;
    }
    .pile.iis {
      background: #ff9a1a;
      border-color: #000;
      color: #000;
    }
    .pile .name { font-weight: 800; font-size: 1.1rem; color: inherit; }
    .pile .sub { color: inherit; font-size: .92rem; margin-top: 2px; font-weight: 800; opacity: .95; }
    .pile .amt {
      font-family: "Literata", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 700;
      white-space: nowrap;
      color: inherit;
    }
    .bar {
      height: 28px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      margin-top: 16px;
      background: #fff;
      border: 4px solid #000;
    }
    .bar .dep { background: #023018; }
    .bar .iis { background: #ff9a1a; }
    .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    .steps li { display: grid; grid-template-columns: 58px 1fr; gap: 12px; }
    .steps .n {
      width: 58px; height: 58px; border-radius: 16px;
      display: grid; place-items: center;
      background: #023018; color: #fff;
      font-weight: 800; font-size: 1.25rem;
      border: 4px solid #000;
    }
    .steps .t { font-weight: 800; font-size: 1.15rem; margin-bottom: 4px; color: #000; }
    .steps .d { color: #000; line-height: 1.4; font-weight: 800; }
    .section-title {
      font-family: "Literata", Georgia, serif;
      font-size: 1.8rem;
      margin: 30px 0 12px;
    }
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 5px 5px 0 #000;
      border: 4px solid #000;
    }
    table { width: 100%; border-collapse: collapse; min-width: 740px; }
    th, td {
      padding: 16px;
      text-align: right;
      border-bottom: 2px solid #000;
      font-variant-numeric: tabular-nums;
      color: #000;
    }
    th:first-child, td:first-child { text-align: left; }
    th {
      position: sticky; top: 0;
      background: #023018;
      font-size: .95rem;
      color: #ffffff;
      font-weight: 800;
      border-bottom: 4px solid #000;
    }
    td { font-size: 1.05rem; font-weight: 800; }
    tr:last-child td { border-bottom: 0; }
    tr.highlight td { background: #ff9a1a; }
    tr.good td { background: #1f8f4e; color: #fff; }
    tr.good td strong { color: #fff; }
    .note {
      margin-top: 18px;
      color: #000;
      font-size: .95rem;
      line-height: 1.45;
      max-width: 42em;
      font-weight: 800;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .panel { animation: rise .45s ease both; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">MozgaTrust</h1>
    <p class="lead">План на 20 миллионов простыми словами: куда положить, сколько получать каждый месяц и что останется.</p>

    <div class="chooser" role="tablist" aria-label="Выбор варианта">
      <button class="choice active" id="btn-v1" type="button">
        <strong>Вариант 1 — пенсия сразу</strong>
        <small>100 тысяч ₽ каждый месяц с первого месяца</small>
      </button>
      <button class="choice" id="btn-v2" type="button">
        <strong>Вариант 2 — пенсия через 3 года</strong>
        <small>Сначала копим, потом 100 тысяч ₽ каждый месяц</small>
      </button>
    </div>

    <div id="app"></div>
    <p class="note">Это семейная модель «на пальцах», не банковская выписка. Цифры округлены. Перед решениями сверьте ставки в банке и у брокера.</p>
  </div>

  <script>
    const DATA = {"v1": {"key": "v1", "title": "Пенсия сразу", "dep0": 11715361, "iis0": 8284639, "pension_from_month": 1, "total_2040": 23336529, "total_pension": 18000000, "total_tax": 2798895, "years": [{"year": 2026, "dep_end": 11821255, "iis_end": 9759869, "pension": 1200000, "lump": 0, "tax": 174214, "total": 21581124}, {"year": 2027, "dep_end": 11997339, "iis_end": 11497790, "pension": 1200000, "lump": 0, "tax": 176932, "total": 23495129}, {"year": 2028, "dep_end": 2135717, "iis_end": 13545180, "pension": 1200000, "lump": 10000000, "tax": 179068, "total": 15680897}, {"year": 2029, "dep_end": 1138017, "iis_end": 15957145, "pension": 1200000, "lump": 0, "tax": 9309, "total": 17095162}, {"year": 2030, "dep_end": 17514, "iis_end": 18798604, "pension": 1200000, "lump": 0, "tax": 0, "total": 18816118}, {"year": 2031, "dep_end": 19125779, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 204662, "total": 19125779}, {"year": 2032, "dep_end": 19460713, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 208438, "total": 19460713}, {"year": 2033, "dep_end": 19822980, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 212523, "total": 19822980}, {"year": 2034, "dep_end": 20214813, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 216941, "total": 20214813}, {"year": 2035, "dep_end": 20638625, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 221719, "total": 20638625}, {"year": 2036, "dep_end": 21097024, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 226887, "total": 21097024}, {"year": 2037, "dep_end": 21592834, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 232477, "total": 21592834}, {"year": 2038, "dep_end": 22129109, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 238524, "total": 22129109}, {"year": 2039, "dep_end": 22709150, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 245064, "total": 22709150}, {"year": 2040, "dep_end": 23336529, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 252137, "total": 23336529}]}, "v2": {"key": "v2", "title": "Пенсия через 3 года", "dep0": 8659231, "iis0": 11340769, "pension_from_month": 37, "total_2040": 38532865, "total_pension": 14400000, "total_tax": 3952133, "years": [{"year": 2026, "dep_end": 9674991, "iis_end": 13360198, "pension": 0, "lump": 0, "tax": 130861, "total": 23035190}, {"year": 2027, "dep_end": 10865760, "iis_end": 15739224, "pension": 0, "lump": 0, "tax": 149241, "total": 26604984}, {"year": 2028, "dep_end": 2135717, "iis_end": 18541878, "pension": 0, "lump": 10000000, "tax": 168844, "total": 20677595}, {"year": 2029, "dep_end": 1138017, "iis_end": 21843596, "pension": 1200000, "lump": 0, "tax": 9309, "total": 22981612}, {"year": 2030, "dep_end": 17514, "iis_end": 25733244, "pension": 1200000, "lump": 0, "tax": 0, "total": 25750758}, {"year": 2031, "dep_end": 26626369, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 289229, "total": 26626369}, {"year": 2032, "dep_end": 27573440, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 299907, "total": 27573440}, {"year": 2033, "dep_end": 28597804, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 311457, "total": 28597804}, {"year": 2034, "dep_end": 29705768, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 323949, "total": 29705768}, {"year": 2035, "dep_end": 30904155, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 337460, "total": 30904155}, {"year": 2036, "dep_end": 32200345, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 352074, "total": 32200345}, {"year": 2037, "dep_end": 33602320, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 367881, "total": 33602320}, {"year": 2038, "dep_end": 35118712, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 384978, "total": 35118712}, {"year": 2039, "dep_end": 36758860, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 403470, "total": 36758860}, {"year": 2040, "dep_end": 38532865, "iis_end": 0, "pension": 1200000, "lump": 0, "tax": 423472, "total": 38532865}]}};
    const fmt = (n) => new Intl.NumberFormat("ru-RU").format(Math.round(n));
    const mln = (n) => (n / 1_000_000).toFixed(1).replace(".", ",") + " млн ₽";

    function view(s) {
      const depPct = Math.round((s.dep0 / 20_000_000) * 100);
      const iisPct = 100 - depPct;
      const body = s.years.map((y) => {
        const cls = y.lump > 0 ? "highlight" : (y.year === 2031 ? "good" : "");
        return `<tr class="${cls}">
          <td>${y.year}</td>
          <td>${fmt(y.dep_end)}</td>
          <td>${fmt(y.iis_end)}</td>
          <td>${y.pension ? fmt(y.pension) : "—"}</td>
          <td>${y.lump ? fmt(y.lump) : "—"}</td>
          <td>${fmt(y.tax)}</td>
          <td><strong>${fmt(y.total)}</strong></td>
        </tr>`;
      }).join("");

      const when = s.pension_from_month === 1
        ? "С первого месяца"
        : "С 2029 года (после 3 лет)";
      const step2title = s.pension_from_month === 1 ? "Каждый месяц сразу" : "Первые 3 года";
      const step2text = s.pension_from_month === 1
        ? "Получаем 100 тысяч ₽ на жизнь с вклада."
        : "Пенсию не снимаем — проценты копятся на вкладе и в ИИС.";

      return `
        <div class="panel">
          <div class="hero-facts">
            <div class="fact accent">
              <div class="label">На жизнь каждый месяц</div>
              <div class="value">100 000 ₽</div>
              <div class="hint">${when}</div>
            </div>
            <div class="fact">
              <div class="label">Через 3 года заберём сразу</div>
              <div class="value">10 млн ₽</div>
              <div class="hint">С банковского вклада</div>
            </div>
            <div class="fact">
              <div class="label">К 2040 останется около</div>
              <div class="value">${mln(s.total_2040)}</div>
              <div class="hint">Если идти по плану</div>
            </div>
          </div>

          <div class="split">
            <div class="block">
              <h2>Куда кладём 20 млн</h2>
              <div class="piles">
                <div class="pile">
                  <div>
                    <div class="name">Банковский вклад</div>
                    <div class="sub">Отсюда пенсия и 10 млн</div>
                  </div>
                  <div class="amt">${mln(s.dep0)}</div>
                </div>
                <div class="pile iis">
                  <div>
                    <div class="name">ИИС — гособлигации</div>
                    <div class="sub">Растёт до 2031, потом можно забрать</div>
                  </div>
                  <div class="amt">${mln(s.iis0)}</div>
                </div>
              </div>
              <div class="bar" aria-hidden="true">
                <span class="dep" style="width:${depPct}%"></span>
                <span class="iis" style="width:${iisPct}%"></span>
              </div>
            </div>

            <div class="block">
              <h2>Четыре шага</h2>
              <ol class="steps">
                <li>
                  <div class="n">1</div>
                  <div>
                    <div class="t">Сейчас</div>
                    <div class="d">Делим деньги: часть во вклад, часть в ИИС.</div>
                  </div>
                </li>
                <li>
                  <div class="n">2</div>
                  <div>
                    <div class="t">${step2title}</div>
                    <div class="d">${step2text}</div>
                  </div>
                </li>
                <li>
                  <div class="n">3</div>
                  <div>
                    <div class="t">Через 3 года</div>
                    <div class="d">Забираем ещё 10 миллионов с вклада.</div>
                  </div>
                </li>
                <li>
                  <div class="n">4</div>
                  <div>
                    <div class="t">С 2031 года</div>
                    <div class="d">Закрываем ИИС. Всё вместе продолжает кормить пенсию.</div>
                  </div>
                </li>
              </ol>
            </div>
          </div>

          <h2 class="section-title">Таблица по годам</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Год</th>
                  <th>На вкладе</th>
                  <th>На ИИС</th>
                  <th>Пенсия за год</th>
                  <th>Ещё забрали</th>
                  <th>Налог</th>
                  <th>Всего осталось</th>
                </tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
          </div>
          <p class="note">
            Жёлтая строка — год, когда забираем 10 млн.
            Зелёная — год, когда деньги с ИИС переходят на вклад.
            Всего на пенсию за весь срок: <strong>${fmt(s.total_pension)} ₽</strong>.
            Налоги с процентов по вкладу: <strong>${fmt(s.total_tax)} ₽</strong>.
          </p>
        </div>`;
    }

    const app = document.getElementById("app");
    const btn1 = document.getElementById("btn-v1");
    const btn2 = document.getElementById("btn-v2");

    function show(key) {
      app.innerHTML = view(DATA[key]);
      btn1.classList.toggle("active", key === "v1");
      btn2.classList.toggle("active", key === "v2");
      history.replaceState(null, "", "#" + key);
    }

    btn1.addEventListener("click", () => show("v1"));
    btn2.addEventListener("click", () => show("v2"));
    show(location.hash === "#v2" ? "v2" : "v1");
  </script>
</body>
</html>
